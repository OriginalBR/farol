<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D2A38"/>
      <stop offset="100%" stop-color="#0E1520"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A65A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#26333F" stroke-width="4"/>
  
  <!-- Radar Wave Rings -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="#F2A65A" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="220" r="95" fill="none" stroke="#F2A65A" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="256" cy="220" r="50" fill="none" stroke="#F2A65A" stroke-opacity="0.4" stroke-width="2.5"/>

  <!-- Light Beam Cone -->
  <polygon points="256,220 100,60 412,60" fill="url(#beamGrad)" opacity="0.35"/>

  <!-- Signal Transmitter Tower / Farol Core -->
  <path d="M256 160 L276 360 L236 360 Z" fill="#16202C" stroke="#8FA0B0" stroke-width="3"/>
  <line x1="220" y1="360" x2="292" y2="360" stroke="#ECEFF3" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="310" x2="282" y2="310" stroke="#26333F" stroke-width="3"/>
  <line x1="240" y1="260" x2="272" y2="260" stroke="#26333F" stroke-width="3"/>
  <line x1="256" y1="130" x2="256" y2="160" stroke="#ECEFF3" stroke-width="4" stroke-linecap="round"/>

  <!-- Glowing Beacon Core -->
  <circle cx="256" cy="220" r="16" fill="#F2A65A" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="8" fill="#FFFFFF"/>
</svg>
